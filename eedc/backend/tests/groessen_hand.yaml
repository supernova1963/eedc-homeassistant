    hinweis: "Derselbe Zeitpunkt wie der Textsensor `eedc_speicher_voll_um`, nur als ISO-8601-Zeitstempel — damit HA „in 2 h\" anzeigen kann. ⚠ **Der alte Sensor bleibt unverändert** („14:00\"): sein Textformat ist seit v4.0.27 Vertrag, und ein Umbau bräche jede Automation, die ihn vergleicht. Attribut `quelle` nennt den Partner; `sim_start_stunde`/`sim_start_anteil` nennen die Startannahme der Simulation (s. `eedc_speicher_voll_um`)"
