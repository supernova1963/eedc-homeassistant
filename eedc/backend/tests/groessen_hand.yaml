  "eedc_prognose_rest_today_kwh":
    abschnitt: "SENSOR-REFERENZ.md#pv-prognose-sensoren-eedc_prognose_"
    test: "backend/tests/test_ha_export_prognose_150.py"
    hinweis: "**Echter Rest**: Prognose der verbleibenden Stunden ab jetzt (ohne IST) — die **laufende Stunde geht anteilig** nach den noch verbleibenden Minuten ein (#339), der Wert sinkt also gleichmäßig statt in Stundensprüngen. Ab einem Zehntel des Tages-SOLL **nachgeführt**: × Faktor aus dem gemessenen Vormittag (IST gegen Prognose bis zur selben Stunde, gedämpft, 0,4…1,6) — Attribute `nachfuehr_faktor` und `rest_modell_kwh` (der Rest ohne Nachführung). Der Steuerungswert für Automationen — „wie viel PV kommt heute noch?\" · **Rest heute** — Prognose der verbleibenden Stunden, laufende Stunde anteilig nach Restminuten (#339); aus demselben Kanon → rollt synchron mit „heute\"."
  "eedc_speicher_leer_um_ts":
    abschnitt: "BERECHNUNGEN.md#preis--und-speicher-sensoren-des-ha-exports-stufe-3b"
    test: "backend/tests/test_s3b_preise_speicher_sensoren.py"
    hinweis: "Wann der Ladestand nach heutiger Simulation **in den Leerstand übergeht** — derselbe Lauf wie „Speicher voll um\". Gibt es keinen solchen Übergang, gibt es den Sensor nicht. ⚠ **Der Zeitpunkt kann in der Vergangenheit liegen:** die Simulation startet bei der zuletzt gemessenen Stunde (`sim_start_stunde`/`sim_start_anteil`), nicht bei „jetzt\" — hinkt Home Assistant nach, kann der Übergang in diese Lücke fallen, und der Sensor sagt dann, seit wann der Speicher nach dem Modell leer ist"
  "eedc_speicher_netzladen_kosten_cent":
