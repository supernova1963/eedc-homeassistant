    hinweis: "**AN:** Der Börsenpreis der laufenden Stunde ist **negativ** und für dieselbe Stunde wird PV-Erzeugung erwartet (§51 EEG). ⛔ Das ist ein Marktzustand, kein Urteil — was daraus folgt, entscheidest du **Attribute:** `boersenpreis_cent`, `pv_prognose_kwh`, `ueberschuss_prognose_kwh`, `negative_stunden_heute`, `naechste_negative_ab`"
  "eedc_grundlast_kw":
