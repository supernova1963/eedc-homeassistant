  "eedc_speicher_voll_um":
    abschnitt: "SENSOR-REFERENZ.md#pv-prognose-sensoren-eedc_prognose_"
    test: "backend/tests/test_s2_entscheidungs_sensoren.py"
    hinweis: "Uhrzeit, zu der der Speicher voraussichtlich voll ist (Simulation ab **aktuellem** Ladestand, **mit** dem gepflegten Wirkungsgrad — bei mehreren Speichern dem niedrigsten). Die PV-Stunden ab dem Start folgen wie „Rest heute\" dem gemessenen Vormittag (× `nachfuehr_faktor` von `eedc_prognose_rest_today_kwh`). Rechnet mit dem gewichteten **8-Wochen-Verbrauchsprofil** — nicht mit dem 7-Tage-Profil von `eedc_verbrauchsprognose_heute_kwh`; die Attribute `profil_typ` (`gewichtet_8_wochen`), `profil_wochen`, `profil_halbwertszeit_tage`, `profil_stufe`, `profil_tage` und `verbrauch_annahme_kwh` nennen die Annahme (Details in [§8a](SENSOR-REFERENZ.md#8a-eedc-pv-prognose-nach-ha-exportieren-mqtt--ha-sensoren)). Ohne brauchbare Historie: `profil_typ: kein_profil`, `verbrauch_annahme_kwh: 0`. ⭐ **Startannahme (V1, 22.09.2026):** Die Simulation beginnt bei der zuletzt von HA verdichteten Stunde — und rechnet von ihr nur die **halbe** Stunde, weil der Startwert ein Stunden**mittel** ist und damit die Mitte dieser Stunde beschreibt. Die Attribute `sim_start_stunde` und `sim_start_anteil` (0,5 bzw. 1,0) nennen sie. Bis 4.0.50 startete sie bei der laufenden Uhrzeit und rechnete diese Stunde ganz; der gemeldete Zeitpunkt kann sich dadurch um bis zu eine halbe Stunde verschieben. Das Textformat „HH:MM“ bleibt unverändert. · Uhrzeit „Speicher voll\" aus der SoC-Simulation ab aktuellem Speicherstand — **inkl. Ladeverluste**: gerechnet mit dem gepflegten Wirkungsgrad des Speichers. Vorher lief die Rechnung verlustfrei und meldete deshalb zu früh. Die **Verbrauchsannahme** der Simulation ist das gewichtete 8-Wochen-Profil (jüngere Tage zählen stärker, Halbwertszeit 14 Tage; Kaskade gleicher Wochentag → Werktag/Wochenende → alle Tage). Attribute `profil_typ` (`gewichtet_8_wochen`), `profil_wochen`, `profil_halbwertszeit_tage`, `profil_stufe` (welche Kaskadenstufe griff), `profil_tage` und `verbrauch_annahme_kwh` (der Tagesverbrauch, mit dem gerechnet wurde) nennen sie. ⚠ **Ein anderes Modell als `eedc_verbrauchsprognose_heute_kwh`** (7-Tage-Profil der Live-Kachel) — wer beide in einer Automation verrechnet, sieht das an `profil_typ`. Ohne brauchbare Historie rechnet die Simulation **ohne Verbrauch** (`profil_typ: kein_profil`, `verbrauch_annahme_kwh: 0`)."
