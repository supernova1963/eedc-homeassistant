  "eedc_verbrauchsprognose_heute_kwh":
    abschnitt: "SENSOR-REFERENZ.md#anlage-weite-sensoren"
    test: "backend/tests/test_s2_entscheidungs_sensoren.py"
    hinweis: "**Verbrauchsprognose für heute** — dieselbe Zahl wie die Kachel „Verbrauchsprognose\" unter *Heute* in *Cockpit → Live*: die Summe des stündlichen Verbrauchsprofils (Werktag oder Wochenende aus der eigenen Historie, Wärmepumpen-Anteil mit dem Tagesmittel der Außentemperatur korrigiert — gemessenes Warmwasser und Kühlen bleiben dabei unverändert). Es ist der **Gesamt**verbrauch (Haus + Batterie + Wärmepumpe + Wallbox + Sonstige), keine Haushalts-Prognose. Attribute `profil_typ`, `profil_tage`, `profil_slots` nennen die Grundlage; **`stundenprofil_kwh`** trägt seit diesem Release die 24 Stundenwerte, aus denen die Summe entsteht, und **`wp_stundenprofil_kwh`** den darin enthaltenen Wärmepumpen-Anteil. ⚠ Der WP-Anteil ist eine **Teilmenge**, kein Summand daneben — wer beide addiert, zählt ihn doppelt. ⚠ **Nur aus einem eigenen Profil:** Solange eedc noch keine Historie hat und die Anzeige das Standard-Lastprofil zeigt, entsteht **kein** Sensor — ein Modellwert darf in keine Automation laufen."
  "eedc_verbrauchsprognose_morgen_kwh":
    abschnitt: "SENSOR-REFERENZ.md#anlage-weite-sensoren"
    test: "backend/tests/test_n591_verbrauchsprognose_morgen.py"
    hinweis: "**Verbrauchsprognose für morgen** — dieselbe Rechnung wie `eedc_verbrauchsprognose_heute_kwh`, nur für den nächsten Tag: das Profil des **Wochentags von morgen** (am Freitag also das Wochenend-Profil für Samstag) und der Wärmepumpen-Anteil mit dem Tagesmittel der **Temperaturvorhersage von morgen** korrigiert. Gedacht für die Planung über die Nacht — etwa den Speicher zur günstigsten Stunde so zu laden, dass er bis zum nächsten Morgen reicht. Attribute `profil_typ`, `profil_tage`, `profil_slots`, `stundenprofil_kwh` (die Stundenwerte von morgen; so viele, wie die Wettervorhersage für morgen liefert), `wp_stundenprofil_kwh` (der Wärmepumpen-Anteil darin, eine **Teilmenge**) und **`datum`** — der Tag, für den der Wert gilt; nach Mitternacht erkennt eine Automation daran einen noch nicht erneuerten Wert. ⚠ **Nur aus einem eigenen Profil für den Tagestyp von morgen** — gibt es zum Beispiel noch kein Wochenend-Profil, fehlt der Sensor am Freitagabend. ⭐ **Startet nach dem Update abgewählt** (neu mit diesem Release): unter [Einstellungen → Integration → MQTT-Export](HANDBUCH_EINSTELLUNGEN.md#63-mqtt-export) anhaken, er trägt dort die Markierung „Neu\". · **Verbrauchsprognose für morgen** — die Rechnung von `eedc_verbrauchsprognose_heute_kwh` (Live-Kachel, 7-Tage-Profil) für den nächsten Tag: Profil des Wochentags von morgen, Wärmepumpen-Anteil mit dem Tagesmittel der Temperaturvorhersage von morgen korrigiert. Attribute `stundenprofil_kwh`, `wp_stundenprofil_kwh`, `profil_typ`/`profil_tage`/`profil_slots` und `datum`; ein anderes Modell als die Simulation hinter `eedc_speicher_voll_um`. Startet nach dem Update abgewählt — unter *Einstellungen → Integration → MQTT-Export* anhaken."
