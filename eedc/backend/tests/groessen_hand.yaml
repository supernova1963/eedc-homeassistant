    hinweis: "Tagesprognose morgen / übermorgen / in 3 Tagen. Trägt jeweils das korrigierte Stundenprofil des Tages als Attribut `stundenprofil_kwh` (24 kWh-Werte, Slot-Konvention wie oben) — z. B. für Lade-Planung per Template. Werte ändern sich, wenn OpenMeteo einen neuen Modelllauf liefert (alle paar Stunden) **oder** das gelernte Korrekturprofil aktualisiert wird (nächtlich) — stundenlang unveränderte Werte sind normal. · Attribut `stundenprofil_kwh` = 24 Backward-Slots (kWh); Sensor-State == Σ Slots."
  "eedc_prognose_heute_kwh":
    abschnitt: "SENSOR-REFERENZ.md#pv-prognose-sensoren-eedc_prognose_"
    test: "backend/tests/test_ha_export_prognose_150.py"
    hinweis: "**Kanonische Tagesprognose** (== App-Anzeige): die volle Prognose für den ganzen Tag, **nicht** IST + Rest. Ändert sich, wenn OpenMeteo einen neuen Modelllauf liefert. Trägt das Stundenprofil des Tages als Attribut `stundenprofil_kwh` (24 Werte; Slot N = Energie der Stunde N−1 → N). · **PV-Tagesprognose heute** — voller Tageswert (kanonisch, rollt mit OpenMeteo, == Anzeige)."
  "eedc_prognose_heute_nachmittag_kwh":
    abschnitt: "BERECHNUNGEN.md#vmnm-split-an-solar-noon-v3220"
    hinweis: "PV-Prognose je Tageshälfte, für **heute und morgen** (die Abendentscheidung braucht den Folgetag). ⭐ **Die Grenze ist der Sonnenhöchststand**, nicht 13:00 — dieselbe Aufteilung wie in *Cockpit → Aussicht*. Sie reist als Attribut **`solar_noon`** („13:28\") mit, damit eine Automation sie lesen kann statt sie zu raten."
  "eedc_prognose_heute_rollend_kwh":
    abschnitt: "BERECHNUNGEN.md#4-prognosen-aussichten"
