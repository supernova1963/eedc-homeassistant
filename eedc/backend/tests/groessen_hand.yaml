    test: "backend/tests/test_s3b_preise_speicher_sensoren.py"
    hinweis: "**AN:** Der Ladestand geht bis Mitternacht **nicht** in den Leerstand über und endet über der Schwelle — dieselbe Regel und derselbe Simulationslauf wie „Speicher leer um\" **Attribute:** `min_soc_prozent`, `min_soc_um`, `end_soc_prozent`, Modell-Angaben"
  "eedc_speicher_soc_prozent":
    abschnitt: "SENSOR-REFERENZ.md#steuerungshilfen--die-gruppe-für-automationen-neu"
    test: "backend/tests/test_s2_entscheidungs_sensoren.py"
    hinweis: "Kapazitätsgewichteter Ladestand aller Speicher. Attribut `je_speicher` schlüsselt nach Gerät auf — **nur die heute laufenden**: ein stillgelegter Speicher steht weiter in der Historie, aber nicht mehr in dieser Aufschlüsselung. Der Ladestand selbst ist davon unberührt"
  "eedc_speicher_strom_kosten_cent":
    abschnitt: "BERECHNUNGEN.md#preis--und-speicher-sensoren-des-ha-exports-stufe-3b"
    test: "backend/tests/test_s3b_preise_speicher_sensoren.py"
    hinweis: "Was eine aus dem Speicher **entnommene** Kilowattstunde kostet: die entgangene Einspeisevergütung ÷ Wirkungsgrad. Attribute: `wirkungsgrad_prozent`, `wirkungsgrad_quelle` (`gemessen` · `parameter`), `wirkungsgrad_messung`, `je_speicher`, `verguetung_cent`. ⭐ **Nie mit dem Vorgabewert:** gibt es weder einen gemessenen noch einen gepflegten Wirkungsgrad, entsteht der Sensor **nicht**. ⚠ `wirkungsgrad_messung` sagt immer, was die Messung ergeben hat — und jedes Wort verlangt einen anderen Handgriff: `zu-wenig-monate` (noch nicht genug erfasste Monate — das wächst von allein) · **`keine-entladung`** (Monate genug, aber die Entladung deines Speichers ist nicht erfasst — ordne ihr eine Quelle zu oder pflege den Wert; das geht nie von allein weg) · `keine-ladung` (im Fenster wurde gar nicht geladen) · `fenster-zu-kurz` (kurzes Fenster und kein SoC-Sensor) · `nicht-ermittelbar` (der gemessene Quotient ist unmöglich — der Daten-Checker sagt wo)"
  "eedc_speicher_voll":
    abschnitt: "SENSOR-REFERENZ.md#steuerungshilfen--die-gruppe-für-automationen-neu"
