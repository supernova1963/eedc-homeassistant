    hinweis: "Empfohlene **Netzladung** des Speichers heute — laden in günstigen Stunden, entladen gegen das teuerste Defizit danach. Attribute: `stunden`, `ersparnis_cent`, `soc_prozent`, `frei_kwh`, `wirkungsgrad_prozent`, `arbitrage_faehig`. ⚠ Er entsteht **nur**, wenn mindestens ein Speicher „lädt aus dem Netz\" gesetzt hat **und** sich etwas lohnt — sonst gibt es ihn nicht (eine 0 hieße „geprüft und lohnt nicht\", und das ist eine andere Aussage)"
  "eedc_bestes_fenster_ab":
    abschnitt: "SENSOR-REFERENZ.md#steuerungshilfen--die-gruppe-für-automationen-neu"
    test: "backend/tests/test_fenster_rechner.py"
    hinweis: "Beginn des günstigsten **2-Stunden-Fensters** ab jetzt. Attribute `dauer_1h`/`_2h`/`_3h`/`_4h` je mit `ab`, `bis`, `stunden`, `kosten_cent_kwh`, `delta_cent_kwh_vs_jetzt`; dazu `kosten_profil_cent_kwh` und `preis_profil_cent_kwh` (je Slot) und `frist`. ⚠ **Bei einem Festpreis ohne Überschuss gibt es keine günstigste Stunde** — jede kostet gleich viel, und das Fenster beginnt dann schlicht jetzt. Erst der Überschuss macht einen Unterschied; `delta_cent_kwh_vs_jetzt` steht dort auf 0.  ⭐ **Warum vier feste Dauern:** Ein Sensor kann keinen Parameter entgegennehmen — eine Dashboard-Karte liest Zustände, sie ruft keine Dienste. Das Kostenprofil ist **mengenneutral** (gilt für eine kWh) und deckt damit „jetzt oder um 14 Uhr\" für Waschmaschine, Trockner, Spülmaschine und Auto"
  "eedc_bezugspreis_jetzt_cent":
    abschnitt: "BERECHNUNGEN.md#preis--und-speicher-sensoren-des-ha-exports-stufe-3b"
    test: "backend/tests/test_s3b_preise_speicher_sensoren.py"
    hinweis: "Was **du** in der laufenden Stunde je Kilowattstunde zahlst. Bei Festpreis oder Zeitfenstern **exakt** der Arbeitspreis deines Tarifs; bei einem dynamischen Tarif `(1 + USt) × Börsenpreis + Aufschlag`, wobei der Aufschlag **abgeleitet** wird (s. den Kasten „Woher der Preis je Stunde kommt\"). Attribute: `preisquelle`, `aufschlag_cent`, `aufschlag_quelle`, `aufschlag_basis`, `ust_prozent`, `tarif`, `gueltig_ab`, `markt` (nur bei Börsenbezug), `stundenprofil_cent` und `stundenprofil_morgen_cent` (je 24 Slots), `waermepumpe_cent` (nur bei **eigenem** WP-Tarif)"
  "eedc_eigenverbrauch_wert_cent":
    abschnitt: "BERECHNUNGEN.md#preis--und-speicher-sensoren-des-ha-exports-stufe-3b"
    test: "backend/tests/test_s3b_preise_speicher_sensoren.py"
    hinweis: "Was eine selbst verbrauchte Kilowattstunde **spart**: Bezugspreis − Einspeisevergütung. ⚠ Er entsteht nur mit einem **vollständigen** Bezugspreis; bei einem dynamischen Tarif ohne ableitbaren Aufschlag wäre „nackter Börsenpreis minus Vertragsvergütung\" keine Näherung, sondern eine Differenz aus zwei verschiedenen Preisebenen — dann fehlt er, und `eigenverbrauch_wert_grund` am Bezugspreis-Sensor sagt warum"
  "eedc_einspeiseverguetung_cent":
    abschnitt: "BERECHNUNGEN.md#preis--und-speicher-sensoren-des-ha-exports-stufe-3b"
