configuration:
  einstellungen_pin_zuruecksetzen:
    name: "Einstellungs-PIN zurücksetzen"
    description: >-
      Nur für den Notfall: Wenn du die PIN vergessen hast, mit der du in eedc
      die Einstellungen geschützt hast. Einschalten, eedc neu starten — die PIN
      ist dann gelöscht. Danach bitte wieder ausschalten, sonst wird sie bei
      jedem Start erneut entfernt. Ohne gesetzte PIN passiert nichts.
  live_snapshot_5min_enabled:
    name: "5-Min-Snapshots (TEST — bitte aus lassen)"
    description: >-
      Internes Test-Feature für Phase 1 der Counter-basierten Live-IST-Linie.
      Standard-User brauchen nichts zu tun: keine User-sichtbare Wirkung,
      nur erhöhte HA-API-Last (12× pro Stunde statt 1×). Wird nach Abschluss
      der Validierung entfernt oder automatisch aktiv geschaltet.
