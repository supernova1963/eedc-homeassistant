configuration:
  einstellungen_pin_zuruecksetzen:
    name: "Reset settings PIN"
    description: >-
      Emergency use only: if you forgot the PIN protecting the settings in eedc.
      Turn it on, restart eedc — the PIN is then cleared. Afterwards turn it off
      again, otherwise the PIN is removed on every start. Does nothing if no PIN
      is set.
  live_snapshot_5min_enabled:
    name: "5-min snapshots (TEST — leave off)"
    description: >-
      Internal test feature for Phase 1 of the counter-based live IST line.
      Regular users: leave this off. No user-visible effect, only increased
      HA API load (12× per hour instead of 1×). Will be removed or auto-enabled
      after validation is complete.
