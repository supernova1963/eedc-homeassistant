name: Tests

# Macht das v3.34-QS-Sicherheitsnetz maschinell durchsetzbar: bisher lief die
# Backend-Suite nur lokal via scripts/smoke.sh vor jedem Release (release.sh).
# Dieser Workflow spiegelt smoke.sh (App-Boot + Routen-Check + pytest) und
# blockt PRs/Pushes auf main mit rotem Test — die Drift-Klasse, gegen die
# Phase A/B/C absichern, fällt damit durch Test statt durch Inspektion.
# Siehe docs/ADR-001-BERECHNUNGS-LAYER.md + Audit v3.34 (M6/§2).
#
# Seit IA-V4 E1-P3 zusätzlich: Frontend-Job (tsc + Design-Konformitäts-Wächter
# + Vitest-Routing/Komponenten-Tests). Eng fokussiert, kein Coverage-Ziel.

on:
  push:
    branches:
      - main
    paths:
      - 'eedc/backend/**'
      - 'eedc/frontend/**'
      - 'eedc/pytest.ini'
      - '.github/workflows/tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'eedc/backend/**'
      - 'eedc/frontend/**'
      - 'eedc/pytest.ini'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          # Gleiche Minor-Version wie das HA-Add-on-Dockerfile (python:3.11-slim),
          # damit CI denselben Interpreter testet, der ausgeliefert wird.
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            eedc/backend/requirements.txt
            eedc/backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: eedc
        run: pip install -r backend/requirements-dev.txt

      - name: App-Boot + Routen-Check (spiegelt smoke.sh Schritt 2)
        working-directory: eedc
        run: |
          python -c "
          import sys
          from backend.main import app
          EXPECTED_ROUTES = 217
          n = len(app.routes)
          print(f'Routes: {n}')
          if n < EXPECTED_ROUTES:
              print(f'FEHLER: erwartet >= {EXPECTED_ROUTES}, gefunden {n}', file=sys.stderr)
              sys.exit(1)
          "

      - name: Akzeptanz-Tests (pytest)
        working-directory: eedc
        run: python -m pytest -q --no-header

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: eedc/frontend/package-lock.json

      - name: Install dependencies
        working-directory: eedc/frontend
        run: npm ci

      - name: Typecheck (tsc)
        working-directory: eedc/frontend
        run: npx tsc --noEmit

      # --max-warnings 0 (im lint-Script): der Zähler stand bei 101 und ist auf 0
      # abgearbeitet — react-refresh abgeschaltet (kollidiert mit dem *Teile.tsx-
      # Muster), die 19 echten exhaustive-deps einzeln bereinigt. Ohne dieses Gate
      # wächst er unbemerkt wieder zu, und stale-closure-Bugs verstecken sich im Rauschen.
      - name: Lint (ESLint, keine Warnungen erlaubt)
        working-directory: eedc/frontend
        run: npm run lint

      - name: Design-Konformität (Inline-Hex-Wächter)
        working-directory: eedc/frontend
        run: npm run check:design

      - name: Achsen-Konformität (Einheit + de-DE tickFormatter)
        working-directory: eedc/frontend
        run: npm run check:achsen

      - name: de-DE-Anzeige-Konformität (Tausenderpunkt/Komma/Datum)
        working-directory: eedc/frontend
        run: npm run check:de-de

      # Roh-Control-Freeze repo-weit (Regel 0a) — Nachfolger des mit dem
      # v4.0.0-Flip retired check:v4-migration (Teil 3). Ohne dieses Gate ist
      # die Invariante „rohe Controls nur als freigegebene SoT-/Infra-Impl"
      # außerhalb von check:buttons/check:form-controls ungewächtert.
      - name: Roh-Control-Freeze (SoT-Komponenten-Pflicht)
        working-directory: eedc/frontend
        run: npm run check:roh-controls

      # Client-Hälfte von ADR-002/P3-a (A26/N106). Der Backend-Wächter
      # (test_wurzelmuster_konformitaet.py) endet an der API-Grenze — im
      # Frontend rechnete die kWp-Verteilung ein zweites Mal auf der ROHSPALTE.
      # Regel: Anzeige/Rechnung lesen `leistung_kwp_effektiv`, nur Eingabefelder
      # lesen `leistung_kwp`.
      - name: Kennwert-Rohzugriffe (Investitions-kWp nur effektiv anzeigen)
        working-directory: eedc/frontend
        run: npm run check:kennwert-roh

      - name: Vitest (Routing/Redirects + Komponenten + Wächter)
        working-directory: eedc/frontend
        run: npm test
