name: Tests

# Macht das v3.34-QS-Sicherheitsnetz maschinell durchsetzbar: bisher lief die
# Backend-Suite nur lokal via scripts/smoke.sh vor jedem Release (release.sh).
# Dieser Workflow spiegelt smoke.sh (App-Boot + Routen-Check + pytest) und
# blockt PRs/Pushes auf main mit rotem Test — die Drift-Klasse, gegen die
# Phase A/B/C absichern, fällt damit durch Test statt durch Inspektion.
# Siehe docs/ADR-001-BERECHNUNGS-LAYER.md + Audit v3.34 (M6/§2).
#
# Seit IA-V4 E1-P3 zusätzlich: Frontend-Job (tsc + Design-Konformitäts-Wächter
# + Vitest-Routing/Komponenten-Tests). Eng fokussiert, kein Coverage-Ziel.

on:
  push:
    branches:
      - main
    paths:
      - 'eedc/backend/**'
      - 'eedc/frontend/**'
      - 'eedc/pytest.ini'
      - '.github/workflows/tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'eedc/backend/**'
      - 'eedc/frontend/**'
      - 'eedc/pytest.ini'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          # Gleiche Minor-Version wie das HA-Add-on-Dockerfile (python:3.11-slim),
          # damit CI denselben Interpreter testet, der ausgeliefert wird.
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            eedc/backend/requirements.txt
            eedc/backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: eedc
        run: pip install -r backend/requirements-dev.txt

      # Der Routen-Check stand hier bis zum 23.08.2026 als Inline-Skript mit
      # EXPECTED_ROUTES = 217 und der Pruefung n < EXPECTED_ROUTES. Beides war defekt:
      # die App hat 271 Routen, der Puffer betrug also 54 Endpunkte -- ein nicht mehr
      # eingebundener Router waere unbemerkt durchgelaufen. Und den Pruefer kannte NUR
      # CI, er lief in keinem lokalen Gate (dieselbe Klasse wie der lint-Befund vom
      # 12.08.). Er ist jetzt backend/tests/test_routen_baseline.py: laeuft damit in
      # beiden pytest-Schritten unten UND lokal, vergleicht gegen eine eingecheckte
      # Routen-Liste und nennt die fehlende Route beim Namen statt eine Zahl zu melden.
      # Der App-Boot wird dabei mitgeprueft -- der Test importiert backend.main.
      # (Der alte Schrittname verwies auf smoke.sh Schritt 2; dieses Skript existiert
      # im Repo nicht mehr.)

      - name: Akzeptanz-Tests (pytest)
        working-directory: eedc
        run: python -m pytest -q --no-header

      # N-167: Der Runner steht in UTC, die Entwickler-Box in Europe/Berlin — zwei Zonen,
      # die sich nur um 2 Stunden unterscheiden und (auesserst selten) um einen Tag. Eine
      # Probe, die einen Erwartungswert aus der ECHTEN Uhrzeit ableitet, faellt darin
      # womoeglich nie auf: Der Ursprungsfall war in 4 von 24 Stunden rot (5, 11, 17, 23) und
      # wurde nur entdeckt, weil derselbe Baum um 16:5x gruen und um 17:12 rot war.
      # Auckland liegt 10-12 Stunden entfernt und trifft damit verlaesslich eine ganz andere
      # Stunde und regelmaessig einen anderen Tag. Am 23.08.2026 ueber sieben Zonen gemessen:
      # kein Fehlschlag, aber es hielt bis dahin auch nichts.
      - name: Akzeptanz-Tests in einer fernen Zeitzone (N-167 — Uhr-Hermetik)
        working-directory: eedc
        env:
          TZ: Pacific/Auckland
        run: python -m pytest -q --no-header

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        # ⭐ `@v5`, nicht `@v4` (06.09.2026): v4 laeuft selbst auf der
        # Node-20-Runtime, die GitHub abgekuendigt hat — daher die Annotation
        # „Node.js 20 is deprecated … forced to run on Node.js 24" bei jedem Lauf.
        # ⛔ `node-version: '20'` bleibt bewusst unveraendert: Sie bestimmt die
        # Node-Version fuer npm/vitest, NICHT die Runtime der Action. Beidseitig
        # gemessen — `deploy-website.yml` faehrt `@v5` MIT `node-version: 20` und
        # hat KEINE Annotation. Wer beides zusammen anfasst, aendert ohne Not die
        # Testumgebung und weiss hinterher nicht, welche Haelfte gewirkt hat.
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: eedc/frontend/package-lock.json

      - name: Install dependencies
        working-directory: eedc/frontend
        run: npm ci

      - name: Typecheck (tsc)
        working-directory: eedc/frontend
        run: npx tsc --noEmit

      # --max-warnings 0 (im lint-Script): der Zähler stand bei 101 und ist auf 0
      # abgearbeitet — react-refresh abgeschaltet (kollidiert mit dem *Teile.tsx-
      # Muster), die 19 echten exhaustive-deps einzeln bereinigt. Ohne dieses Gate
      # wächst er unbemerkt wieder zu, und stale-closure-Bugs verstecken sich im Rauschen.
      - name: Lint (ESLint, keine Warnungen erlaubt)
        working-directory: eedc/frontend
        run: npm run lint

      # ── Die fuenf einzelnen check:*-Schritte sind mit E8/M14 entfallen ───────
      # (2026-08-24). Sie liefen auf ZWEI Einhaengungsebenen gleichzeitig, und
      # beide Richtungen waren schaedlich:
      #   * check:design / check:achsen / check:de-de hatten laengst einen
      #     Vitest-Wrapper und liefen deshalb DOPPELT — derselbe Pruefer,
      #     zweimal bezahlt, und bei einer Aenderung zwei Stellen zu pflegen.
      #   * check:roh-controls / check:kennwert-roh liefen NUR hier und in
      #     keinem lokalen Lauf. Ein Pruefer, den nur CI kennt, meldet erst nach
      #     dem Push und ordnet den Fehler keinem einzelnen Commit mehr zu —
      #     die Gegenrichtung des lint-Befunds vom 12.08.
      # Beide haben jetzt einen Wrapper unter src/test/, `npm test` unten faehrt
      # sie mit. Dass das so BLEIBT, haelt src/test/check-einhaengung.test.ts
      # fest: er meldet rot, sobald ein check:* aus package.json von `npm test`
      # aus nicht mehr erreichbar ist. Wer hier wieder einen Einzelschritt
      # eintraegt, baut die zweite Ebene neu auf.
      #
      # Ausgenommen bleiben check:park-leertest und check:chart-audit — beides
      # Playwright-Livetests gegen eine laufende Box, in CI nicht lauffaehig.

      - name: Vitest (Routing/Redirects + Komponenten + Waechter, inkl. aller check:*)
        working-directory: eedc/frontend
        run: npm test
